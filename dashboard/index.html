<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consilio · Canlı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0E100F; --surface:#171A19; --surface2:#1F2321; --line:#2A2E2C;
    --text:#F2F2EE; --muted:#A7ABA6;
    --purple:#836EF9; --purple-text:#B9ADFF; --deep:#200052;
    --ok:#7ED3A2; --ok-bg:rgba(76,175,125,.14); --ok-line:rgba(76,175,125,.38);
    --berry:#A0055D; --berry-text:#F07AB5; --berry-bg:rgba(160,5,93,.22);
    --font:"Hanken Grotesk",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r:6px;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; color:var(--text); font:17px/1.5 var(--font); background:var(--bg); -webkit-font-smoothing:antialiased; }
  main { max-width:1440px; margin:0 auto; padding:24px 40px 40px; }
  a { color:var(--purple-text); text-underline-offset:3px; }

  .mast { display:grid; grid-template-columns:1fr auto auto; align-items:end; gap:32px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .mast h1 { margin:0; color:#45A9A9; font:700 40px/1 var(--font); letter-spacing:-.02em; }
  .mast .kunye { font:400 15px/1.4 var(--font); color:var(--muted); margin-top:8px; }
  .mast .kunye a { font:400 14px var(--mono); color:var(--muted); }
  .sayi { text-align:right; }
  .sayi small { display:block; font:500 17px var(--font); color:var(--muted); margin-bottom:2px; }
  .sayi b { font:700 44px/1.05 var(--font); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .sayi span { font:500 20px var(--font); color:var(--muted); }

  .dosya { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-top:20px; padding:14px 18px 14px 22px;
           background:var(--deep); border-radius:var(--r); }
  .dosya .no { font:700 26px var(--font); letter-spacing:-.01em; }
  .dosya .durum { font:500 17px var(--font); color:#CFC8F4; }
  .dosya .sure { font:600 18px var(--font); font-variant-numeric:tabular-nums; }
  .dosya .tutar { font:400 16px var(--font); color:#CFC8F4; font-variant-numeric:tabular-nums; }
  .nav { margin-left:auto; display:flex; gap:6px; }
  .nav button { font:600 15px var(--font); background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.25);
                padding:6px 14px; border-radius:var(--r); cursor:pointer; transition:background-color .15s; }
  .nav button:hover { background:rgba(255,255,255,.1); }
  .nav button.on { background:var(--purple); border-color:var(--purple); color:var(--bg); }

  .belge { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  .belge > div { background:var(--surface); border-radius:var(--r); padding:18px 22px 20px; }
  .etiket { font:600 14px var(--font); color:var(--muted); margin:0 0 8px; }
  .belge pre { margin:0; white-space:pre-wrap; word-break:break-word; font:400 19px/1.45 var(--font); }

  .kurul { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; }
  .uye { background:var(--surface); border-radius:var(--r); padding:18px 22px 20px; min-height:260px; display:flex; flex-direction:column; gap:6px; }
  .uye .rn { font:600 14px var(--font); color:var(--muted); }
  .uye .adres { font:400 15px var(--mono); color:var(--text); }
  .uye .itibar { font:400 14px var(--font); color:var(--muted); }
  .uye .puan { font:700 104px/.95 var(--font); letter-spacing:-.04em; margin-top:8px; font-variant-numeric:tabular-nums; }
  .uye .puan small { font:500 30px var(--font); color:var(--muted); letter-spacing:0; }
  .uye .yorum { font:400 18px/1.4 var(--font); min-height:50px; }
  .muhur { align-self:flex-start; margin-top:10px; font:600 16px var(--font); padding:6px 12px; border-radius:var(--r); }
  .muhur.bekle { background:var(--surface2); color:var(--muted); }
  .muhur.muhurlu { background:rgba(131,110,249,.16); color:var(--purple-text); border:1px solid rgba(131,110,249,.45); }
  .uye.yeni .muhur, .uye.yeni .puan { animation:belir .18s ease-out both; }
  @keyframes belir { from { opacity:.35; } to { opacity:1; } }
  .sonuc { margin-top:auto; font:600 16px var(--font); padding:8px 12px; border-radius:var(--r); font-variant-numeric:tabular-nums; }
  .sonuc.isabet { color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); }
  .sonuc.ceza { color:#FFF0F6; background:var(--berry); }
  .sonuc small { display:block; font:400 14px var(--font); color:var(--muted); margin-top:2px; }
  .uye.cezali .adres { text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--berry-text); color:var(--muted); }

  .hukum { display:none; margin-top:16px; padding:22px 28px; border-radius:var(--r); background:var(--purple); color:var(--bg); }
  .hukum.goster { display:grid; grid-template-columns:auto 1fr auto; gap:28px; align-items:center; animation:belir .2s ease-out both; }
  .hukum .skor { font:700 112px/.95 var(--font); letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .hukum .skor small { font:500 34px var(--font); opacity:.65; letter-spacing:0; }
  .hukum .metin { font:500 21px/1.45 var(--font); }
  .hukum .metin b { font-weight:700; }
  .hukum a { font:600 16px var(--font); color:var(--bg); white-space:nowrap; }

  .alt { display:grid; grid-template-columns:1fr 1.2fr; gap:16px; margin-top:16px; }
  .alt > section { background:var(--surface); border-radius:var(--r); padding:18px 22px 16px; }
  .alt .etiket { font:600 16px var(--font); color:var(--text); margin-bottom:10px; }
  table.itibar { width:100%; border-collapse:collapse; font:15px var(--font); font-variant-numeric:tabular-nums; }
  table.itibar th { text-align:left; font:500 14px var(--font); color:var(--muted); border-bottom:1px solid var(--line); padding:4px 8px 6px 0; }
  table.itibar td { padding:7px 8px 7px 0; border-bottom:1px solid var(--line); }
  table.itibar td:first-child { font:400 14px var(--mono); }
  table.itibar tr:last-child td { border-bottom:0; }
  table.itibar tr.eksi td { color:var(--berry-text); }
  .tutanak ol { list-style:none; margin:0; padding:0; max-height:270px; overflow:auto; }
  .tutanak li { display:grid; grid-template-columns:76px 1fr auto; gap:12px; padding:6px 8px; margin:0 -8px; border-top:1px solid var(--line); font:400 15px var(--font); }
  .tutanak li:first-child { border-top:0; }
  .tutanak li.vurgu { background:var(--berry-bg); border-radius:var(--r); border-top-color:transparent; }
  .tutanak time { color:var(--muted); font-variant-numeric:tabular-nums; }
  .tutanak a { font-size:14px; }
  .err { font:600 15px var(--font); color:var(--berry-text); margin-top:12px; }
  @media (max-width:900px) {
    main { padding:16px; } .mast { grid-template-columns:1fr; gap:12px; } .sayi { text-align:left; }
    .belge, .kurul, .alt, .hukum.goster { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .uye.yeni .muhur, .uye.yeni .puan, .hukum.goster { animation:none; } }
</style>
</head>
<body>
<main>
  <header class="mast">
    <div>
      <h1>Consilio</h1>
      <div class="kunye">Monad testnet · <a id="contractLink" target="_blank"></a></div>
    </div>
    <div class="sayi"><small>Havuzdaki değerlendirici</small><b id="poolN">–</b></div>
    <div class="sayi"><small>Kontratta kilitli</small><b id="vault">–</b> <span>MON</span></div>
  </header>

  <div class="dosya">
    <span class="no" id="jobTitle">Dosya bekleniyor</span>
    <span class="durum" id="jobStatus">—</span>
    <span class="sure" id="jobClock"></span>
    <span class="tutar" id="jobAmount"></span>
    <span class="nav"><button id="prev" aria-label="önceki dosya">←</button><button id="next" aria-label="sonraki dosya">→</button><button id="live">Canlı</button></span>
  </div>

  <section class="belge">
    <div><p class="etiket">Şartname</p><pre id="spec">—</pre></div>
    <div><p class="etiket">Teslimat · <span id="worker"></span></p><pre id="deliverable">—</pre></div>
  </section>

  <section class="kurul" id="panel"></section>
  <section class="hukum" id="result"></section>

  <div class="alt">
    <section>
      <p class="etiket">İtibar</p>
      <table class="itibar"><thead><tr><th>Değerlendirici</th><th>İsabet</th><th>İş</th><th>Kazanç</th><th>Ceza</th></tr></thead><tbody id="board"></tbody></table>
    </section>
    <section class="tutanak">
      <p class="etiket">İşlem kaydı</p>
      <ol id="feed"></ol>
    </section>
  </div>
  <div class="err" id="err"></div>
</main>

<script src="../vendor/ethers.umd.min.js"></script>
<script src="config.js" onerror="window.PR_CONFIG = window.PR_CONFIG || {}"></script>
<script>
// ayarlar: URL'nin # kısmı > config.js
const hp = new URLSearchParams(location.hash.slice(1));
const CFG = Object.assign({ rpc: "https://testnet-rpc.monad.xyz", explorer: "https://testnet.monadvision.com" }, window.PR_CONFIG || {});
if (hp.get("c")) CFG.contract = hp.get("c");
if (hp.get("r")) CFG.rpc = hp.get("r");
if (!CFG.contract) {
  document.getElementById("err").textContent = "Kontrat adresi yok. Büyük ekranı kontrol panelindeki linkten aç.";
  throw new Error("kontrat adresi yok");
}
const ABI = [
  "function jobCount() view returns (uint256)",
  "function getJob(uint256) view returns (tuple(address client,address worker,uint256 amount,uint256 fee,uint8 status,uint8 commitCount,uint8 revealCount,uint8 finalScore,uint64 commitDeadline,uint64 revealDeadline,address[3] reviewers,bytes32[3] commits,uint8[3] scores,string spec,string deliverable))",
  "function reviewerInfo(address) view returns (bool registered,uint32 reviews,uint32 weightSum,uint32 open,uint256 stake,uint256 earned,uint256 slashed)",
  "function getPool() view returns (address[])",
  "event ReviewerRegistered(address indexed reviewer, uint256 stake)",
  "event JobCreated(uint256 indexed jobId, address indexed client, address indexed worker, uint256 amount, uint256 fee, string spec)",
  "event Submitted(uint256 indexed jobId, address indexed worker, string deliverable, address[3] reviewers, uint64 commitDeadline)",
  "event Committed(uint256 indexed jobId, address indexed reviewer)",
  "event RevealPhase(uint256 indexed jobId, uint64 revealDeadline)",
  "event Revealed(uint256 indexed jobId, address indexed reviewer, uint8 score, string comment)",
  "event Slashed(uint256 indexed jobId, address indexed reviewer, uint256 amount)",
  "event ReviewerPaid(uint256 indexed jobId, address indexed reviewer, uint8 weight, uint256 reward)",
  "event Finalized(uint256 indexed jobId, uint8 finalScore, uint256 workerPayout, uint256 clientRefund)",
];
const STATUS = ["Açık · teslimat bekleniyor", "Mühürlü oylama", "Oylar açılıyor", "Sonuçlandı", "İptal"];
const ROMAN = ["I", "II", "III"];
const ZERO32 = "0x" + "00".repeat(32);
const provider = new ethers.JsonRpcProvider(CFG.rpc);
const c = new ethers.Contract(CFG.contract, ABI, provider);
const $ = (id) => document.getElementById(id);
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const fmt = (w) => Number(ethers.formatEther(w)).toLocaleString("tr-TR", { maximumFractionDigits: 5 });
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
$("contractLink").href = `${CFG.explorer}/address/${CFG.contract}`;
$("contractLink").textContent = "kontrat " + short(CFG.contract);

const paid = {};      // jobId -> { reviewer -> {weight, reward} }
const slashes = {};   // jobId -> { reviewer -> amount }
const finals = {};    // jobId -> {finalScore, workerPayout, clientRefund, tx}
const comments = {};  // jobId -> { reviewer -> comment }
const stamped = new Set();
const feed = [];
let lastBlock = null, viewJob = null, follow = true, jobCount = 0, now = 0;

function addFeed(text, tx, vurgu = false) {
  feed.unshift({ t: new Date().toLocaleTimeString("tr-TR"), text, tx, vurgu });
  if (feed.length > 80) feed.pop();
  $("feed").innerHTML = feed.map((f) =>
    `<li class="${f.vurgu ? "vurgu" : ""}"><time>${f.t}</time><span>${f.text}</span>${f.tx ? `<a target="_blank" href="${CFG.explorer}/tx/${f.tx}">tx ↗</a>` : "<span></span>"}</li>`).join("");
}

async function pollEvents() {
  const latest = await provider.getBlockNumber();
  if (lastBlock === null) lastBlock = Math.max(0, latest - 90);
  while (lastBlock < latest) {
    const to = Math.min(latest, lastBlock + 90); // public RPC'ler geniş aralığı reddedebilir
    const logs = await provider.getLogs({ address: CFG.contract, fromBlock: lastBlock + 1, toBlock: to });
    for (const log of logs) {
      const ev = c.interface.parseLog(log); if (!ev) continue;
      const a = ev.args, tx = log.transactionHash, id = a.jobId !== undefined ? Number(a.jobId) : null;
      switch (ev.name) {
        case "ReviewerRegistered": addFeed(`${short(a.reviewer)} havuza katıldı · teminat ${fmt(a.stake)} MON`, tx); break;
        case "JobCreated": addFeed(`Dosya ${id} açıldı · ${fmt(a.amount)} MON ödeme + ${fmt(a.fee)} MON ücret kilitlendi`, tx); break;
        case "Submitted": addFeed(`Dosya ${id} teslim edildi · 3 değerlendirici rastgele atandı`, tx); break;
        case "Committed": addFeed(`Dosya ${id} · ${short(a.reviewer)} oyunu mühürledi (puan gizli)`, tx); break;
        case "RevealPhase": addFeed(`Dosya ${id} · mühürler açılıyor`, tx); break;
        case "Revealed": (comments[id] ||= {})[a.reviewer.toLowerCase()] = a.comment;
          addFeed(`Dosya ${id} · ${short(a.reviewer)} puanı: ${a.score}/10`, tx); break;
        case "Slashed": (slashes[id] ||= {})[a.reviewer.toLowerCase()] = a.amount;
          addFeed(`Dosya ${id} · ${short(a.reviewer)} teminatından ${fmt(a.amount)} MON kesildi`, tx, true); break;
        case "ReviewerPaid": (paid[id] ||= {})[a.reviewer.toLowerCase()] = { weight: Number(a.weight), reward: a.reward };
          addFeed(`Dosya ${id} · ${short(a.reviewer)} +${fmt(a.reward)} MON (isabet ${"●".repeat(Number(a.weight))})`, tx); break;
        case "Finalized": finals[id] = { fin: Number(a.finalScore), pay: a.workerPayout, refund: a.clientRefund, tx };
          addFeed(`Dosya ${id} sonuçlandı · medyan ${a.finalScore}/10 · freelancer ${fmt(a.workerPayout)} MON`, tx); break;
      }
    }
    lastBlock = to;
  }
}

function clock(j) {
  const dl = j.status === 1 ? Number(j.commitDeadline) : j.status === 2 ? Number(j.revealDeadline) : 0;
  if (!dl) return "";
  const s = dl - now;
  return s > 0 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "süre doldu";
}

async function renderBoard() {
  const pool = await c.getPool();
  $("poolN").textContent = pool.length;
  const infos = await Promise.all(pool.map((a) => c.reviewerInfo(a)));
  const rows = pool.map((a, i) => {
    const r = infos[i], n = Number(r.reviews);
    return { a, n, acc: n ? Number(r.weightSum) / (3 * n) : -1, earned: r.earned, slashed: r.slashed };
  }).sort((x, y) => (y.acc - x.acc) || (y.n - x.n)).slice(0, 10);
  $("board").innerHTML = rows.map((r) => `<tr class="${r.slashed > r.earned ? "eksi" : ""}">
    <td>${short(r.a)}</td><td>${r.acc < 0 ? "—" : "%" + Math.round(r.acc * 100)}</td><td>${r.n}</td>
    <td>${fmt(r.earned)}</td><td>${r.slashed > 0n ? "−" + fmt(r.slashed) : "0"}</td></tr>`).join("");
  return Object.fromEntries(pool.map((a, i) => [a.toLowerCase(), infos[i]]));
}

async function render() {
  jobCount = Number(await c.jobCount());
  now = Number((await provider.getBlock("latest")).timestamp);
  $("vault").textContent = fmt(await provider.getBalance(CFG.contract));
  $("live").classList.toggle("on", follow);
  const infoMap = await renderBoard();
  if (!jobCount) return;
  if (follow || viewJob === null) viewJob = jobCount - 1;
  const id = viewJob;
  const raw = await c.getJob(id);
  const j = { ...raw.toObject(), status: Number(raw.status), reviewers: [...raw.reviewers], commits: [...raw.commits], scores: [...raw.scores].map(Number) };
  $("jobTitle").textContent = `Dosya No. ${id}`;
  $("jobStatus").textContent = STATUS[j.status];
  $("jobClock").textContent = clock(j);
  $("jobAmount").textContent = `${fmt(j.amount)} MON ödeme · ${fmt(j.fee)} MON ücret`;
  $("spec").textContent = j.spec;
  $("deliverable").textContent = j.deliverable || "Teslimat bekleniyor…";
  $("worker").textContent = j.worker === "0x0000000000000000000000000000000000000000" ? "açık iş" : "freelancer " + short(j.worker);

  if (j.status === 0 || j.status === 4) { $("panel").innerHTML = ""; $("result").className = "hukum"; return; }
  const fin = finals[id];
  // kontratta havuz = ücret + kesilen cezalar; isabetli değerlendiricilere ağırlıklarına göre bölünür
  const slashTotal = Object.values(slashes[id] || {}).reduce((s, x) => s + x, 0n);
  const sumW = Object.values(paid[id] || {}).reduce((s, p) => s + p.weight, 0);
  $("panel").innerHTML = j.reviewers.map((a, i) => {
    const k = a.toLowerCase(), info = infoMap[k];
    const acc = info && Number(info.reviews) ? "%" + Math.round(Number(info.weightSum) / (3 * Number(info.reviews)) * 100) + " isabet · " + info.reviews + " iş" : "yeni değerlendirici";
    const sealed = j.commits[i] !== ZERO32, score = j.scores[i];
    let cls = "", mid = "";
    if (score) {
      const pk = `${id}-${k}-puan`; if (!stamped.has(pk)) { stamped.add(pk); cls = "yeni"; }
      const cm = (comments[id] || {})[k];
      mid = `<div class="puan">${score}<small>/10</small></div><div class="yorum">${cm ? "“" + esc(cm.replace(/^\[[^\]]+\]\s*/, "")) + "”" : ""}</div>`;
    } else if (sealed) {
      const key = `${id}-${k}`; if (!stamped.has(key)) { stamped.add(key); cls = "yeni"; }
      mid = `<div class="muhur muhurlu">Mühürlü</div><div class="yorum" style="color:var(--muted)">Puan gizli · ${j.status === 1 ? "diğerleri bekleniyor" : "açılıyor"}</div>`;
    } else if (j.status === 1) {
      mid = `<div class="muhur bekle">İnceliyor</div>`;
    } else {
      mid = `<div class="muhur bekle">Oy yok</div>`;
    }
    let foot = "";
    const p = (paid[id] || {})[k], s = (slashes[id] || {})[k];
    if (j.status === 3) {
      if (s) { cls += " cezali"; foot = `<div class="sonuc ceza">${score ? `Medyandan ${Math.abs(score - Number(j.finalScore))} puan sapma` : "Süresinde oy yok"} · −${fmt(s)} MON</div>`; }
      else if (p) {
        const feeShare = sumW ? (j.fee * BigInt(p.weight)) / BigInt(sumW) : 0n;
        const split = slashTotal > 0n ? `<small>ücret ${fmt(feeShare)} + ceza payı ${fmt(p.reward - feeShare)}</small>` : "";
        foot = `<div class="sonuc isabet">İsabet ${"●".repeat(p.weight)}${"○".repeat(3 - p.weight)} · +${fmt(p.reward)} MON${split}</div>`;
      }
    }
    return `<article class="uye ${cls}"><div class="rn">Değerlendirici ${ROMAN[i]}</div>
      <div class="adres">${short(a)}</div><div class="itibar">${acc}</div>${mid}${foot}</article>`;
  }).join("");

  const box = $("result");
  if (j.status === 3) {
    const f = Number(j.finalScore);
    const pay = fin ? fin.pay : (f >= 8 ? j.amount : (j.amount * BigInt(f)) / 10n);
    box.className = "hukum goster";
    box.innerHTML = `<div class="skor">${f || "—"}<small>/10</small></div>
      <div class="metin">${f ? `Üç puanın medyanı ${f}. Freelancer'a ödenen: <b>${fmt(pay)} MON</b> (${f >= 8 ? "tamamı" : `%${f * 10}`}).
          ${sumW ? (slashTotal > 0n ? `Ücret ve <b>${fmt(slashTotal)} MON</b> ceza isabetli değerlendiricilere bölündü.`
                                    : "Ücret isabetli değerlendiricilere bölündü.") : ""}`
                                : "Yeterli oy açılmadı. Ödeme ve ücret iş verene iade edildi."}</div>
      ${fin ? `<a target="_blank" href="${CFG.explorer}/tx/${fin.tx}">İşlem ↗</a>` : "<span></span>"}`;
  } else box.className = "hukum";
}

$("prev").onclick = () => { follow = false; viewJob = Math.max(0, (viewJob ?? 0) - 1); render(); };
$("next").onclick = () => { follow = false; viewJob = Math.min(jobCount - 1, (viewJob ?? 0) + 1); render(); };
$("live").onclick = () => { follow = true; render(); };

async function tick() {
  try { await pollEvents(); await render(); $("err").textContent = ""; }
  catch (e) { $("err").textContent = "Bağlantı hatası: " + (e.shortMessage || e.message); }
  setTimeout(tick, 1200);
}
tick();
</script>
</body>
</html>
